apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: co2-calculator
resources:
  - ../../base
  - gateway.yaml
patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml
images:
  - name: ghcr.io/berget-ai/co2-calculator
    newTag: 1.0.5 # {"$imagepolicy": "flux-system:co2-calculator-production:tag"}
labels:
  - pairs:
      environment: production
    includeSelectors: false
