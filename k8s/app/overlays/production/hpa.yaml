apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: co2-calculator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: co2-calculator
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # Launch traffic arrives as a step function (e.g. front page of HN) —
      # double pods every 30s until the load is absorbed.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Stay warm for 5 minutes after a spike; traffic comes in waves as the
      # link spreads.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
