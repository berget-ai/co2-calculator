apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: co2-calculator
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/app/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: co2-emissions-calculator
  targetNamespace: co2-calculator
  dependsOn:
    - name: namespace-co2-calculator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespace-co2-calculator
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s
  prune: true
  sourceRef:
    kind: GitRepository
    name: co2-emissions-calculator
  targetNamespace: co2-calculator
