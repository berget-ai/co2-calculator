apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: co2-calculator
  namespace: flux-system
spec:
  image: ghcr.io/berget-ai/co2-calculator
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: co2-calculator-production
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: co2-calculator
  policy:
    semver:
      # Match every image built from a main push, including prereleases
      # (e.g. 1.0.1-rc.2). Production deploys on every merge to main for now.
      range: ">=1.0.0-0"
---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: co2-calculator
  namespace: flux-system
spec:
  interval: 1m
  # Must reference the GitRepository that owns this repo's manifests — not the
  # infra repo. ImageUpdateAutomation can only see GitRepositories in its own
  # namespace, and co2-emissions-calculator lives here in flux-system.
  sourceRef:
    kind: GitRepository
    name: co2-emissions-calculator
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: Flux Bot
        email: flux@berget.ai
      messageTemplate: "chore: update co2-calculator image to {{ .AutomationObject }}{{ .NewTag }}"
      signingKey:
        secretRef:
          name: flux-gpg-signing-key
    push:
      branch: main
  update:
    path: ./k8s/app/overlays/production
    strategy: Setters
