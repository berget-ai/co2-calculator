server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the build-time .gz files straight from disk when the client
    # accepts gzip — no per-request compression CPU. `on` serves .gz if it
    # exists and skips compressing that response; the gzip directives below
    # remain as the fallback for any file without a precompressed twin.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Kernel-level static file serving + a small file cache — cheap wins for
    # a pod whose only job is serving this directory.
    sendfile on;
    tcp_nopush on;
    open_file_cache max=512 inactive=60s;
    open_file_cache_valid 90s;
    open_file_cache_min_uses 2;

    # Cache static assets. Vite emits these with content-hashed filenames, so
    # a new deploy never collides with a cached copy — safe to cache for a
    # year and mark immutable (the browser will not even revalidate).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Handle SPA routing. index.html must never be cached: it references the
    # hashed assets below, so a stale HTML would keep pointing at an old bundle
    # after a deploy. The hashed assets can be immutable; the HTML cannot.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
