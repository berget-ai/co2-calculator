name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. "none" publishes the current package.json version. Bump via a normal PR when releasing.
        required: true
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @bergetai/co2-calculator test

      - name: Build package
        run: pnpm --filter @bergetai/co2-calculator build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing (npmjs.com → @bergetai → Trusted Publisher:
      # berget-ai/co2-calculator / publish-npm.yml). Same pattern as
      # berget-ai/guardrails-md and berget-ai/cli. No NPM_TOKEN needed.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @bergetai/co2-calculator build

      # Version bumps happen via a normal PR; this workflow publishes
      # whatever package.json currently says (bump input "none" default).
      - name: Publish to NPM (OIDC trusted publishing)
        working-directory: packages/co2-calculator
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
          npm publish
